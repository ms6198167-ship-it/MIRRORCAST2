
name: MirrorCast

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"

targets:
  MirrorCast:
    type: application
    platform: iOS
    sources:
      - AirPlayRoutePicker.swift
      - HomeDashboard.swift
      - MirrorCastApp.swift
      - Receiver.swift
      - ReceiverDetailsView.swift
      - ReceiverDiscovery.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MirrorCast
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      properties:
        NSLocalNetworkUsageDescription: "MirrorCast discovers receivers on your local network."
        UILaunchScreen: {}

  MirrorCastBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - SampleHandler.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MirrorCast.Broadcast
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
