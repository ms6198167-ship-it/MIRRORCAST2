
name: MirrorCast

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"

targets:
  MirrorCast:
    type: application
    platform: iOS
    sources:
      - path: MirrorCastApp.swift
      - path: HomeDashboard.swift
      - path: AirPlayRoutePicker.swift
      - path: Receiver.swift
      - path: ReceiverDiscovery.swift
      - path: ReceiverDetailsView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MirrorCast
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: AppGroup.entitlements
    info:
      properties:
        NSLocalNetworkUsageDescription: "MirrorCast uses your local network to discover and connect to compatible receivers."
        NSBonjourServices:
          - "_mirrorcast._tcp"
        UILaunchScreen: {}

  MirrorCastBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: SampleHandler.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MirrorCast.Broadcast
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: AppGroup.entitlements
    info:
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
