
name: MirrorCast

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"

targets:
  MirrorCast:
    type: application
    platform: iOS

    sources:
      - path: AirPlayRoutePicker.swift
      - path: HomeDashboard.swift
      - path: MirrorCastApp.swift
      - path: Receiver.swift
      - path: ReceiverDetailsView.swift
      - path: ReceiverDiscovery.swift

    dependencies:
      - target: MirrorCastBroadcast
        embed: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MirrorCast
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO

    info:
      properties:
        NSLocalNetworkUsageDescription: "MirrorCast discovers receivers on your local network."
        UILaunchScreen: {}

  MirrorCastBroadcast:
    type: app-extension
    platform: iOS

    sources:
      - path: SampleHandler.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MirrorCast.Broadcast
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO

    info:
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
